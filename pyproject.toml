[project]
name = "knoepfe"
dynamic = ["version"]
description = "Connect and control Elgato Stream Decks"
authors = [
  { name = "Simon Hayessen", email = "simon@lnqs.io" },
  { name = "Simon Brakhane", email = "simon@brakhane.net" },
]
requires-python = ">=3.11"
readme = "README.md"
license = "GPL-3.0-or-later"
dependencies = [
  "schema>=0.7.7",
  "streamdeck>=0.9.5",
  "Pillow>=10.4.0",
  "platformdirs>=4.4.0",
  "click>=8.2.1",
  "aiorun>=2025.1.1",
  "hidapi>=0.14.0.post4",
]

# Optional dependencies for different widget groups
[project.optional-dependencies]
obs = []
audio = []
all = []

[project.urls]
Homepage = "https://github.com/lnqs/knoepfe"
Repository = "https://github.com/lnqs/knoepfe"

[project.scripts]
knoepfe = "knoepfe.cli:main"

# Built-in widget registration via entry points
[project.entry-points."knoepfe.widgets"]
Clock = "knoepfe.widgets.clock:Clock"
Text = "knoepfe.widgets.text:Text"
Timer = "knoepfe.widgets.timer:Timer"

# Workspace configuration for development
[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
knoepfe-example-plugin = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/knoepfe/__init__.py"

[dependency-groups]
dev = ["pytest>=8.4.2", "pytest-asyncio>=0.24.0", "pytest-cov>=5.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/knoepfe"]

[tool.hatch.build.targets.sdist]
exclude = [".venv/", "plugins/"]

[tool.ruff]
lint.select = ["B", "D", "F", "I", "T", "Q"]
lint.ignore = ["D100", "D101", "D102", "D103", "D104", "D107", "D415"]
line-length = 120
include = ["src/**/*.py", "tests/**/*.py", "plugins/**/*.py"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
fail_under = 100
exclude_lines = ["if __name__ == .__main__.:", "if sys.platform"]
exclude_also = [
  "no cover: start(?s:.)*?no cover: stop",
  "\\A(?s:.*# pragma: exclude file.*)\\Z",
]
