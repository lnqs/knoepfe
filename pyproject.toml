[project]
name = "knoepfe"
version = "0.1.1"
description = "Connect and control Elgato Stream Decks"
authors = [{ name = "Simon Hayessen", email = "simon@lnqs.io" }]
requires-python = ">=3.10"
readme = "README.md"
license = "GPL-3.0-or-later"
dependencies = [
  "schema>=0.7.7,<0.8",
  "appdirs>=1.4.4,<2",
  "docopt>=0.6.2,<0.7",
  "streamdeck>=0.9.5,<0.10",
  "Pillow>=10.4.0,<11",
  "aiorun>=2024.8.1,<2025",
  "websockets~=13.1",
  "pulsectl-asyncio>=1.2.1,<2",
  "pulsectl>=24.8.0,<25",
  "simpleobsws>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/lnqs/knoepfe"
Repository = "https://github.com/lnqs/knoepfe"

[project.scripts]
knoepfe = "knoepfe.__main__:main"

[dependency-groups]
dev = [
  "attrs>=24.2.0,<25",
  "black>=24.8.0,<25",
  "cfgv>=3.4.0,<4",
  "click>=8.1.7,<9",
  "coverage>=7.6.1,<8",
  "distlib>=0.3.8,<0.4",
  "filelock>=3.16.1,<4",
  "flake8>=7.1.1,<8",
  "flake8-bugbear>=24.8.19,<25",
  "identify>=2.6.1,<3",
  "iniconfig>=2.0.0,<3",
  "isort>=5.13.2,<6",
  "mccabe>=0.7.0,<0.8",
  "mypy>=1.11.2,<2",
  "mypy-extensions>=1.0.0,<2",
  "nodeenv>=1.9.1,<2",
  "packaging~=24.1",
  "pathspec>=0.12.1,<0.13",
  "platformdirs>=4.3.6,<5",
  "pluggy>=1.5.0,<2",
  "pre-commit>=3.8.0,<4",
  "pycodestyle>=2.12.1,<3",
  "pyflakes>=3.2.0,<4",
  "pytest>=8.3.3,<9",
  "pytest-asyncio>=0.24.0,<0.25",
  "pytest-cov>=5.0.0,<6",
  "pyyaml>=6.0.2,<7",
  "tomli>=2.0.1,<3",
  "types-appdirs>=1.4.3.5,<2",
  "types-docopt>=0.6.11.4,<0.7",
  "types-pillow>=10.2.0.20240822,<11",
  "typing-extensions>=4.12.2,<5",
  "virtualenv>=20.26.5,<21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.isort]
profile = "black"
extend_skip_glob = [".venv/*"]

[tool.black]
extend-exclude = '''
(
  \.venv/               # exclude .venv directory
)
'''

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
  "StreamDeck.*",
  "pulsectl.*",
  "pulsectl_asyncio.*",
  "aiorun.*",
  "schema.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = "ignore::DeprecationWarning:pulsectl_asyncio"
addopts = "--cov=knoepfe --cov-report=term-missing --asyncio-mode=auto"
