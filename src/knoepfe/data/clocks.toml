# ============================================================================
# Clock Widget Examples
# ============================================================================
# Demonstrates various clock configurations using the segment-based layout system

# ============================================================================
# DEVICE SETTINGS
# ============================================================================

[device]
brightness = 100
# Set sleep_timeout to 0 to disable sleep
sleep_timeout = 0

# ============================================================================
# MAIN DECK - 6 Different Clock Examples
# ============================================================================

# ----------------------------------------------------------------------------
# Example 1: Time display (HH:MM:SS) stacked vertically, centered with spacing
# ----------------------------------------------------------------------------
# Layout: 3*24px segments + 2*6px spacing = 84px total, 6px margins top/bottom
[[deck.main]]
type = "Clock"
font = "Roboto"
color = "#fefefe"
interval = 0.2

[[deck.main.segments]]
format = "%H"
x = 12
y = 6
width = 72
height = 24
font = "Roboto:style=Bold"

[[deck.main.segments]]
format = "%M"
x = 12
y = 36
width = 72
height = 24

[[deck.main.segments]]
format = "%S"
x = 12
y = 66
width = 72
height = 24
font = "Roboto:style=Thin"

# ----------------------------------------------------------------------------
# Example 2: Date display (DD/Mon/YYYY) stacked vertically, centered with spacing
# ----------------------------------------------------------------------------
# Layout: 3*24px segments + 2*6px spacing = 84px total, 6px margins top/bottom
[[deck.main]]
type = "Clock"
font = "Roboto"
color = "#fefefe"
interval = 10.0

[[deck.main.segments]]
format = "%d"
x = 12
y = 6
width = 72
height = 24
font = "Roboto:style=Bold"

[[deck.main.segments]]
format = "%b"
x = 12
y = 36
width = 72
height = 24

[[deck.main.segments]]
format = "%Y"
x = 12
y = 66
width = 72
height = 24
font = "Roboto:style=Thin"

# ----------------------------------------------------------------------------
# Example 3: Large hours with small minutes/seconds, centered with spacing
# ----------------------------------------------------------------------------
# Layout: 54px hours + 6px spacing + 24px bottom row = 84px total, 6px margins
# Horizontal spacing: 2px between minutes and seconds
[[deck.main]]
type = "Clock"
color = "#fefefe"
interval = 0.2

[[deck.main.segments]]
format = "%H"
x = 0
y = 6
width = 96
height = 54
font = "Roboto:style=Bold"

[[deck.main.segments]]
format = "%M"
x = 0
y = 66
width = 47
height = 24

[[deck.main.segments]]
format = "%S"
x = 49
y = 66
width = 47
height = 24
font = "Roboto:style=Thin"

# ----------------------------------------------------------------------------
# Example 4: Horizontal time display with colorful segments
# ----------------------------------------------------------------------------
# Height: 48, centered at y=24
# Width with 2px spacing: 3*30 + 2*2 = 94, centered at x=1
[[deck.main]]
type = "Clock"
font = "Roboto:style=Bold"
interval = 0.2

[[deck.main.segments]]
format = "%H"
x = 1
y = 24
width = 30
height = 48
color = "#ff6b6b"  # Coral red

[[deck.main.segments]]
format = "%M"
x = 33
y = 24
width = 30
height = 48
color = "#4ecdc4"  # Turquoise

[[deck.main.segments]]
format = "%S"
x = 65
y = 24
width = 30
height = 48
color = "#ffe66d"  # Soft yellow

# ----------------------------------------------------------------------------
# Example 5: 12-hour format with AM/PM, with spacing
# ----------------------------------------------------------------------------
# Total height: 38 + 2 + 28 + 2 + 24 = 94, centered at y=1
[[deck.main]]
type = "Clock"
color = "#fefefe"

[[deck.main.segments]]
format = "%I"
x = 0
y = 1
width = 96
height = 38
font = "Roboto:style=Bold"

[[deck.main.segments]]
format = "%M"
x = 0
y = 41
width = 96
height = 28

[[deck.main.segments]]
format = "%p"
x = 0
y = 71
width = 96
height = 24
font = "Roboto:style=Thin"

# ----------------------------------------------------------------------------
# Example 6: Simple HH:MM with subtle color
# ----------------------------------------------------------------------------
[[deck.main]]
type = "Clock"
font = "Roboto:style=Bold"
color = "#a29bfe"  # Soft lavender purple
# Uses default: single segment with format '%H:%M' covering full key