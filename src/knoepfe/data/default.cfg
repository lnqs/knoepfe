# Knoepfe configuration.
# This file is parsed as Python code.
# Every valid Python statement can be used, allowing to dynamically create and reuse
# configuration parts.

# Knoepfe provides several functions in this file's namespace:
#
# `device()` -- configure device settings (brightness, sleep timeout, polling frequency)
#
# `plugin.<name>()` -- configure plugins. Pass configuration as keyword arguments.
#
# `deck.<name>([widgets])` -- define decks. A deck named 'main' is required and will be
#                             loaded at startup.
#
# `widget.<Type>()` -- create widgets. Pass configuration as keyword arguments.
#                      All widgets support these common parameters:
#                      - `index`: Position on the deck (0-based). If not specified, widgets
#                                 are placed in order starting from 0, filling any gaps left
#                                 by explicitly indexed widgets.
#                      - `switch_deck`: Name of deck to switch to when widget is pressed.
#                      - `font`: Font family and style (e.g., 'Roboto:style=Bold').
#                      - `color`: Primary color for text/icons (e.g., 'white', '#ff0000').

# Global device configuration
device(
    # Device brightness in percent
    brightness=100,
    # Time in seconds until the device goes to sleep. Set to `None` to prevent this from happening.
    # Widgets may acquire a wake lock to keep the device awake.
    sleep_timeout=10.0,
    # Frequency to poll the hardware state in Hz (1-1000). Higher value means more CPU usage but
    # also more responsive feedback.
    device_poll_frequency=5,
    # Serial number of the device to connect to. Set to `None` to connect to the first available device.
    # serial_number='ABC123',
)

# Main deck - this one is displayed on the device when Knöpfe is started.
# This configuration only uses built-in widgets that don't require additional plugins.
#
# Note: Widgets are placed in order (0, 1, 2, ...) unless you specify an `index` parameter.
# Example: widget.Clock(index=5) would place the clock at position 5, and unindexed widgets
# would fill positions 0-4 in the order they appear in the config.
deck.main([
    # A simple clock widget showing current time
    widget.Clock(segments=[{'format': '%H:%M', 'x': 0, 'y': 0, 'width': 96, 'height': 96}]),
    # A simple timer widget. Acquires the wake lock while running.
    widget.Timer(),
    # A simple text widget displaying static text
    widget.Text(text='Hello\nWorld'),
    # Another clock widget showing date
    widget.Clock(segments=[{'format': '%d.%m.%Y', 'x': 0, 'y': 0, 'width': 96, 'height': 96}], interval=60.0),
    # Another text widget
    widget.Text(text='Knöpfe'),
    # Another timer for different use
    widget.Timer(),
])

# Example of additional deck with more built-in widgets
deck.utilities([
    # Clock with seconds
    widget.Clock(segments=[{'format': '%H:%M:%S', 'x': 0, 'y': 0, 'width': 96, 'height': 96}], interval=0.5),
    # Text widget with deck switch back to main
    widget.Text(text='Back to\nMain', switch_deck='main'),
    # Different date format (multiline)
    widget.Clock(segments=[{'format': '%A\n%B %d', 'x': 0, 'y': 0, 'width': 96, 'height': 96}], interval=60.0),
    # Custom text
    widget.Text(text='Custom\nButton'),
])