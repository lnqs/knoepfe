# Clock Widget Examples
# Demonstrates various clock configurations using the segment-based layout system
#
# Note: All widgets support an `index` parameter to specify their position on the deck.
# Without explicit indices, widgets are placed sequentially (0, 1, 2, ...).
# Example: widget.Clock(index=5, ...) places the clock at position 5.

# Configure device settings
device(brightness=100, sleep_timeout=None)

# Main deck with 6 different clock examples
deck.main([
    # Example 1: Time display (HH:MM:SS) stacked vertically, centered with spacing
    # Original format: "%H;%i;%s" with fonts "bold;regular;thin"
    # Layout: 3*24px segments + 2*6px spacing = 84px total, 6px margins top/bottom
    widget.Clock(
        font='Roboto',
        color='#fefefe',
        interval=0.2,
        segments=[
            {'format': '%H', 'x': 12, 'y': 6, 'width': 72, 'height': 24, 'font': 'Roboto:style=Bold'},
            {'format': '%M', 'x': 12, 'y': 36, 'width': 72, 'height': 24},
            {'format': '%S', 'x': 12, 'y': 66, 'width': 72, 'height': 24, 'font': 'Roboto:style=Thin'},
        ]
    ),
    
    # Example 2: Date display (DD/Mon/YYYY) stacked vertically, centered with spacing
    # Original format: "%d;%M;%Y" with fonts "bold;regular;thin"
    # Layout: 3*24px segments + 2*6px spacing = 84px total, 6px margins top/bottom
    widget.Clock(
        font='Roboto',
        color='#fefefe',
        interval=10.0,
        segments=[
            {'format': '%d', 'x': 12, 'y': 6, 'width': 72, 'height': 24, 'font': 'Roboto:style=Bold'},
            {'format': '%b', 'x': 12, 'y': 36, 'width': 72, 'height': 24},
            {'format': '%Y', 'x': 12, 'y': 66, 'width': 72, 'height': 24, 'font': 'Roboto:style=Thin'},
        ]
    ),
    
    # Example 3: Large hours with small minutes/seconds, centered with spacing
    # Layout: 54px hours + 6px spacing + 24px bottom row = 84px total, 6px margins
    # Horizontal spacing: 2px between minutes and seconds
    widget.Clock(
        color='#fefefe',
        interval=0.2,
        segments=[
            {'format': '%H', 'x': 0, 'y': 6, 'width': 96, 'height': 54, 'font': 'Roboto:style=Bold'},
            {'format': '%M', 'x': 0, 'y': 66, 'width': 47, 'height': 24},
            {'format': '%S', 'x': 49, 'y': 66, 'width': 47, 'height': 24, 'font': 'Roboto:style=Thin'},
        ]
    ),
    
    # Example 4: Horizontal time display with colorful segments
    # Height: 48, centered at y=24
    # Width with 2px spacing: 3*30 + 2*2 = 94, centered at x=1
    widget.Clock(
        font='Roboto:style=Bold',
        interval=0.2,
        segments=[
            {'format': '%H', 'x': 1, 'y': 24, 'width': 30, 'height': 48, 'color': '#ff6b6b'},  # Coral red
            {'format': '%M', 'x': 33, 'y': 24, 'width': 30, 'height': 48, 'color': '#4ecdc4'},  # Turquoise
            {'format': '%S', 'x': 65, 'y': 24, 'width': 30, 'height': 48, 'color': '#ffe66d'},  # Soft yellow
        ]
    ),
    
    # Example 5: 12-hour format with AM/PM, with spacing
    # Total height: 38 + 2 + 28 + 2 + 24 = 94, centered at y=1
    widget.Clock(
        color='#fefefe',
        segments=[
            {'format': '%I', 'x': 0, 'y': 1, 'width': 96, 'height': 38, 'font': 'Roboto:style=Bold'},
            {'format': '%M', 'x': 0, 'y': 41, 'width': 96, 'height': 28},
            {'format': '%p', 'x': 0, 'y': 71, 'width': 96, 'height': 24, 'font': 'Roboto:style=Thin'},
        ]
    ),
    
    # Example 6: Simple HH:MM with subtle color
    widget.Clock(
        font='Roboto:style=Bold',
        color='#a29bfe',  # Soft lavender purple
        # Uses default: single segment with format '%H:%M' covering full key
    ),
])