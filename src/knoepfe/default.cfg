# Knöpfe configuration.
# This file is parsed as Python code.
# Every valid Python statement can be used, allowing to dynamically create and reuse
# configuration parts.

# Knöpfe imports several functions into this files namespace. These are:
#
# `config()` -- set global configuration. A `type` needs to be specified defining the
# schema. This configuration can be used by widgets.
#
# `default_deck()` -- set deck configuration for the deck loaded at program start.
#
# `deck()` -- set deck configuration for auxiliary decks that can be loaded from other decks.
#
# `widget()` -- create a widgets to be used by decks.

config({
  # Global device configuration
  'type': 'knoepfe.config.device',
  # Device brightness in percent
  'brightness': 100,
  # Time in seconds until the device goes to sleep. Set no `None` to prevent this from happening.
  # Widgets may acquire a wake lock to keep the device awake.
  'sleep_timeout': 10.0,
  # Frequency to poll the hardware state in Hz (1-1000). Higher value means more CPU usage but
  # also more responsive feedback.
  'device_poll_frequency': 5,
})

# Default deck. This one is displayed on the device when Knöpfe is started.
# This configuration only uses built-in widgets that don't require additional plugins.
default_deck({
  # Arbitrary ID of the deck to be used to switch to this deck from others
  'id': 'main',
  'widgets': [
    # A simple clock widget showing current time
    widget({'type': 'Clock', 'format': '%H:%M'}),
    # A simple timer widget. Acquires the wake lock while running.
    widget({'type': 'Timer'}),
    # A simple text widget displaying static text
    widget({'type': 'Text', 'text': 'Hello\nWorld'}),
    # Another clock widget showing date
    widget({'type': 'Clock', 'format': '%d.%m.%Y'}),
    # Another text widget
    widget({'type': 'Text', 'text': 'Knöpfe'}),
    # Another timer for different use
    widget({'type': 'Timer'}),
  ],
})

# Example of additional deck with more built-in widgets
deck({
  'id': 'utilities',
  'widgets': [
    # Clock with seconds
    widget({'type': 'Clock', 'format': '%H:%M:%S'}),
    # Text widget with deck switch back to main
    widget({'type': 'Text', 'text': 'Back to\nMain', 'switch_deck': 'main'}),
    # Different date format
    widget({'type': 'Clock', 'format': '%A\n%B %d'}),
    # Custom text
    widget({'type': 'Text', 'text': 'Custom\nButton'}),
  ],
})